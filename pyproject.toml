[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["capture_tool*"]

[project]
name = "capture-tool"
version = "0.1.0"
description = "Windows capture tool: annotate, OCR, and copy shapes to PowerPoint as native shapes"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.8",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.20",
    "rapidocr>=3.0",
    "mss>=9.0",
    "pywin32>=306",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest_tmp -p no:cacheprovider"
markers = [
    "slow: long-running evaluation tests",
    "windows: needs real Windows APIs",
]
