[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["capture_tool*"]

[project]
name = "capture-tool"
version = "0.8.30"
description = "Windows capture tool: annotate, OCR, and copy shapes to PowerPoint as native shapes"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.8",
    "numpy>=2.0",
    "opencv-python-headless>=4.10; sys_platform != 'darwin'",
    # Mac: 4.10 exactly - 4.11+ (and 5.0) bring the KleidiCV ARM HAL whose parallel resize crashed
    # Python now and then (SIGSEGV in kleidicv_resize_generic_stripe_u8, BUG-149)
    "opencv-python-headless==4.10.0.84; sys_platform == 'darwin'",
    "onnxruntime>=1.20",
    "rapidocr>=3.0",
    "mss>=9.0",
    "pywin32>=306; sys_platform == 'win32'",
    "dxcam==0.3.0; sys_platform == 'win32'",          # DXGI desktop duplication: GPU-drawn windows (BUG-142)
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",      # NSPasteboard, NSRunningApplication, NSWindow
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",     # CGWindowList, CGEvent, screen-recording checks
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",   # AXIsProcessTrusted (Accessibility)
    "pyobjc-framework-AVFoundation>=10; sys_platform == 'darwin'",     # screen recording: AVAssetWriter (H.264 + AAC)
    "pyobjc-framework-CoreMedia>=10; sys_platform == 'darwin'",
    "pyobjc-framework-CoreAudio>=10; sys_platform == 'darwin'",
    "pyobjc-framework-ScreenCaptureKit>=10; sys_platform == 'darwin'",  # screen recording: the computer's sound
    "soundcard>=0.4",           # screen recording: microphone (and, on Windows, the computer's sound)
    "ctranslate2>=4.5",         # offline translation (Argos Translate models)
    "sentencepiece>=0.2",
    "sacremoses>=0.1",          # tokenizer of a few newer Argos packs
    "subword-nmt>=0.3.8",
    "onnxruntime-genai>=0.10",  # offline summary (Qwen3 1.7B, downloaded on first use)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest_tmp -p no:cacheprovider"
markers = [
    "slow: long-running evaluation tests",
    "timing: wall-clock bounds measured on a developer PC; not run on shared CI runners (BUG-118)",
    "windows: needs real Windows APIs",
    "mac: needs real macOS APIs (Quartz, Carbon, NSPasteboard)",
    "windows_contract: expectations are the Windows behaviour; pins CAPTURE_PLATFORM=win32 so they also run on a Mac",
]
