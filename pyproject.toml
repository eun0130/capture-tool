[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["capture_tool*"]

[project]
name = "capture-tool"
version = "0.4.2"
description = "Windows capture tool: annotate, OCR, and copy shapes to PowerPoint as native shapes"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.8",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.20",
    "rapidocr>=3.0",
    "mss>=9.0",
    "pywin32>=306",
    "ctranslate2>=4.5",         # offline translation (Argos Translate models)
    "sentencepiece>=0.2",
    "sacremoses>=0.1",          # tokenizer of a few newer Argos packs
    "subword-nmt>=0.3.8",
    "onnxruntime-genai>=0.10",  # offline summary (Qwen3 1.7B, downloaded on first use)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest_tmp -p no:cacheprovider"
markers = [
    "slow: long-running evaluation tests",
    "windows: needs real Windows APIs",
]
