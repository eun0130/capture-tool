name: windows-check

# Real Windows checks run before a release: a folder with Korean letters reaches the AI engine through an
# English-only path (BUG-141); the capture screen's DXGI still frame reads the right place and colours (BUG-142). Runs on pushes that touch that code and
# from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: ["feat/**"]
    paths:
      - "capture_tool/platform/shell.py"
      - "capture_tool/core/ai_local.py"
      - "capture_tool/platform/screen.py"
      - "capture_tool/core/frames.py"
      - "capture_tool/platform/mf_recorder.py"
      - "tests/test_platform_win.py"
      - ".github/workflows/windows-check.yml"

permissions:
  contents: read

jobs:
  korean-paths:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e .[dev]

      - name: Korean folder paths for the AI engine
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X utf8 -m pytest tests/test_platform_win.py -k "PWIN_30 or PWIN_31" -q -s -rs

      - name: DXGI still frame on the real desktop (BUG-142)
        shell: pwsh
        run: python -X utf8 -m pytest tests/test_platform_win.py -k "PWIN_32" -q -s -rs

      - name: Media Foundation (a feature to switch on on Windows Server)
        shell: pwsh
        continue-on-error: true
        run: |
          $f = Get-WindowsFeature Server-Media-Foundation -ErrorAction SilentlyContinue
          if ($f) { "installed before: $($f.Installed)"; if (-not $f.Installed) { Install-WindowsFeature Server-Media-Foundation | Format-List } }
          "mfplat: $(Test-Path C:\Windows\System32\mfplat.dll)  mfreadwrite: $(Test-Path C:\Windows\System32\mfreadwrite.dll)  h264 encoder: $(Test-Path C:\Windows\System32\mfh264enc.dll)"

      - name: Media Foundation writer for screen recording
        shell: pwsh
        run: python -X utf8 -m pytest tests/test_platform_win.py -k "PWIN_33" -q -s -rs

