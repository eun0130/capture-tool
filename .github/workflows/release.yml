name: build-and-release

# Push a tag like v0.3.0 (matching capture_tool/__init__.py) to test, build Setup.exe and publish a release.
# "Run workflow" on the Actions tab builds without releasing (installer attached as a workflow artifact).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e .[dev]

      - name: Download OCR models (bundled into the installer)
        run: python -c "from capture_tool.core.ocr import default_factory; default_factory()"

      - name: Tests (headless; desktop/PowerPoint tests run on a developer PC)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m "not windows and not slow"

      - name: Version must match tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (python -c "import capture_tool; print(capture_tool.__version__)").Trim()
          if ("v$v" -ne "${{ github.ref_name }}") { throw "capture_tool.__version__ ($v) does not match tag ${{ github.ref_name }}" }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: ./build.ps1 -SkipTests

      - uses: actions/upload-artifact@v4
        with:
          name: CaptureTool-Setup
          path: installer/Output/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = if (Test-Path "docs/release-notes/$tag.md") { "docs/release-notes/$tag.md" } else { $null }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists (uploaded from a developer PC); keeping its installer."
          } elseif ($notes) {
            gh release create $tag installer/Output/*.exe --title "캡처 도구 $tag" --notes-file $notes
          } else {
            gh release create $tag installer/Output/*.exe --title "캡처 도구 $tag" --generate-notes
          }
