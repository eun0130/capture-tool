name: build-and-release

# Push a tag like v0.3.0 (matching capture_tool/__init__.py) to test, build Setup.exe and publish a release.
# "Run workflow" on the Actions tab builds without releasing (installer attached as a workflow artifact).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e .[dev]

      - name: Cache OCR models
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/pip/cache/rapidocr
            ${{ env.pythonLocation }}/Lib/site-packages/rapidocr/models
          key: ocr-models-v3.9.2
      - name: Download OCR models (build time only; the installed app never downloads)
        run: python tools/fetch_models.py

      - name: Tests (headless; desktop/PowerPoint tests run on a developer PC)
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          python -m pytest -q -m "not windows and not slow" 2>&1 | Tee-Object pytest.log
          # Qt/onnxruntime can abort on interpreter teardown after a clean run; trust pytest's own
          # verdict (fail only if it reported failures/errors or never reached a pass summary).
          if (Select-String -Path pytest.log -Pattern "( failed|error during collection| errors)" -Quiet) { exit 1 }
          if (-not (Select-String -Path pytest.log -Pattern " passed" -Quiet)) { exit 1 }
          exit 0

      - name: Version must match tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (python -c "import capture_tool; print(capture_tool.__version__)").Trim()
          if ("v$v" -ne "${{ github.ref_name }}") { throw "capture_tool.__version__ ($v) does not match tag ${{ github.ref_name }}" }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installers (집용, then 회사용 without KakaoTalk)
        shell: pwsh
        run: |
          ./build.ps1 -SkipTests
          ./build.ps1 -SkipTests -Edition work

      - name: Hashes for the in-app updater (<installer>.sha256 beside each installer)
        shell: pwsh
        run: |
          Get-ChildItem installer/Output/*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            [IO.File]::WriteAllText("$($_.FullName).sha256", "$h *$($_.Name)`n")
          }

      - uses: actions/upload-artifact@v4
        with:
          name: CaptureTool-Setup
          path: |
            installer/Output/*.exe
            installer/Output/*.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = if (Test-Path "docs/release-notes/$tag.md") { "docs/release-notes/$tag.md" } else { $null }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists (uploaded from a developer PC); keeping its installer."
          } elseif ($notes) {
            gh release create $tag installer/Output/CaptureTool-Setup-*.exe installer/Output/CaptureTool-Setup-*.exe.sha256 --title "캡처 도구 $tag" --notes-file $notes
          } else {
            gh release create $tag installer/Output/CaptureTool-Setup-*.exe installer/Output/CaptureTool-Setup-*.exe.sha256 --title "캡처 도구 $tag" --generate-notes
          }

      - name: Publish the home edition from the public download repository (eun0130/capture_dist)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          DIST_TOKEN: ${{ secrets.DIST_REPO_TOKEN || secrets.WORK_REPO_TOKEN }}
        run: |
          # DIST_REPO_TOKEN (or WORK_REPO_TOKEN with access to both): "repo" on eun0130/capture_dist, the
          # public repository people and the in-app updater download the 개인용 installer from. Without it:
          # tools/publish_work.ps1 -Edition home on a developer PC.
          if (-not $env:DIST_TOKEN) { Write-Host "DIST_REPO_TOKEN not set: run tools/publish_work.ps1 -Edition home on a developer PC"; exit 0 }
          $env:GH_TOKEN = $env:DIST_TOKEN
          $tag = "${{ github.ref_name }}"
          $notes = if (Test-Path "docs/release-notes/$tag.md") { "docs/release-notes/$tag.md" } else { $null }
          gh release view $tag --repo eun0130/capture_dist 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "dist release $tag already exists"; exit 0 }
          if ($notes) {
            gh release create $tag installer/Output/CaptureTool-Setup-*.exe installer/Output/CaptureTool-Setup-*.exe.sha256 --repo eun0130/capture_dist --title "캡처 도구 $tag" --notes-file $notes
          } else {
            gh release create $tag installer/Output/CaptureTool-Setup-*.exe installer/Output/CaptureTool-Setup-*.exe.sha256 --repo eun0130/capture_dist --title "캡처 도구 $tag" --notes "개인용 설치 파일"
          }

      - name: Publish the work edition from its own repository (eun0130/capture_work)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          WORK_TOKEN: ${{ secrets.WORK_REPO_TOKEN }}
        run: |
          # WORK_REPO_TOKEN: a token with "repo" (contents: write) on eun0130/capture_work. Without it the
          # work installer stays in the workflow artifact: publish it with tools/publish_work.ps1.
          if (-not $env:WORK_TOKEN) { Write-Host "WORK_REPO_TOKEN not set: run tools/publish_work.ps1 on a developer PC"; exit 0 }
          $env:GH_TOKEN = $env:WORK_TOKEN
          $tag = "${{ github.ref_name }}"
          $notes = if (Test-Path "docs/release-notes/$tag.md") { "docs/release-notes/$tag.md" } else { $null }
          gh release view $tag --repo eun0130/capture_work 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "work release $tag already exists"; exit 0 }
          if ($notes) {
            gh release create $tag installer/Output/CaptureTool-Work-Setup-*.exe installer/Output/CaptureTool-Work-Setup-*.exe.sha256 --repo eun0130/capture_work --title "캡처 도구 (회사용) $tag" --notes-file $notes
          } else {
            gh release create $tag installer/Output/CaptureTool-Work-Setup-*.exe installer/Output/CaptureTool-Work-Setup-*.exe.sha256 --repo eun0130/capture_work --title "캡처 도구 (회사용) $tag" --notes "회사용 설치 파일 (카카오톡·메일 기능 없음)"
          }
